name: Community release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build exact tagged version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python ops/release.py --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/packages"
      - name: Require physical acceptance for exact artifacts
        run: python ops/release_gate.py "$RUNNER_TEMP/packages/release-manifest.json"
      - name: Sign build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: '${{ runner.temp }}/packages/*'
      - name: Publish volunteer beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" "$RUNNER_TEMP"/packages/* --verify-tag --prerelease --title "Mahlkönig - Decent sync $RELEASE_VERSION" --notes-file docs/release-notes.md

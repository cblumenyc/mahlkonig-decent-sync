name: Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib
          python -m pip install -r bridge/requirements.lock pytest==9.1.1
      - name: Audit public source
        run: python ops/audit_source.py
      - name: Python, actual Tcl and JavaScript tests
        run: python -m pytest -q bridge/tests
      - name: Portable offline delivery smoke
        run: python ops/deployment/deploy_smoke.py bridge
      - name: Build declared release packages
        run: |
          python ops/release.py --version 0.0.0-beta.1 --output "$RUNNER_TEMP/packages"
          python ops/release.py --version 0.0.0-beta.2 --output "$RUNNER_TEMP/packages-next"
      - name: Fresh container install and recovery
        run: python ops/container/verify_install.py "$RUNNER_TEMP/packages/mahlkonig-decent-sync-0.0.0-beta.1-linux-compose.tar.gz" --next-package "$RUNNER_TEMP/packages-next/mahlkonig-decent-sync-0.0.0-beta.2-linux-compose.tar.gz"

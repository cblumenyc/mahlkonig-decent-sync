name: mahlkonig-decent-sync
services:
  sync:
    image: mahlkonig-decent-sync:${SYNC_VERSION:?Use the release environment file}
    build: .
    network_mode: host
    user: "10001:10001"
    environment:
      SYNC_ORIGIN: ${SYNC_ORIGIN:?Set the server LAN HTTP address}
      SYNC_LAN_CIDR: ${SYNC_LAN_CIDR:?Set the trusted LAN subnet}
    volumes:
      - sync-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, /app/healthcheck.py]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  sync-data:
